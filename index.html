<!DOCTYPE html>
<html lang="id">
<head>
<!-- CDN Supabase JS resmi -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f1f5f9; color: #0f172a; }
  #root { display: flex; min-height: 100vh; }

  /* sidebar */
  .sidebar { width: 240px; flex-shrink: 0; background: #0f172a; color: #cbd5e1; display: flex; flex-direction: column; padding: 20px 0; }
  .sidebar-brand { padding: 0 20px 18px; margin-bottom: 8px; border-bottom: 1px solid rgba(148,163,184,0.2); }
  .sidebar-brand-title { color: #fff; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .brand-logo { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; border-radius: 6px; }
  .sidebar-brand-sub { font-size: 11px; color: #64748b; margin-top: 4px; }
  .nav { flex: 1; padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #cbd5e1; cursor: pointer; border: none; background: transparent; text-align: left; width: 100%; }
  .nav-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .nav-item:hover { background: #1e293b; }
  .nav-item.active { background: #4f46e5; color: #fff; }
  .sidebar-foot { padding: 14px 20px 0; margin-top: 8px; border-top: 1px solid rgba(148,163,184,0.2); font-size: 11px; color: #64748b; line-height: 1.6; }

  /* topbar */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .topbar-date { font-size: 13px; color: #64748b; }
  .pill-warning { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; background: #fef3c7; color: #92400e; padding: 5px 12px; border-radius: 999px; }
  .content { flex: 1; min-width: 0; overflow: auto; padding: 24px; }

  /* layout helpers */
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grid { display: grid; gap: 12px; }
  .grid-6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
  .grid-2-1 { grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid-6 { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid-2, .grid-2-1, .grid-3 { grid-template-columns: 1fr; } }

  /* cards */
  .stat-card { border-radius: 12px; border: 1px solid #e2e8f0; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .stat-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: #64748b; }
  .stat-card .value { font-size: 22px; font-weight: 600; color: #0f172a; }
  .stat-card .sub { font-size: 12px; color: #64748b; }
  .tone-indigo { background: #eef2ff; border-color: #c7d2fe; } .tone-indigo .label{color:#4338ca}
  .tone-blue { background: #eff6ff; border-color: #bfdbfe; } .tone-blue .label{color:#1d4ed8}
  .tone-slate { background: #f8fafc; border-color: #e2e8f0; }
  .tone-emerald { background: #ecfdf5; border-color: #a7f3d0; } .tone-emerald .label{color:#047857}
  .tone-rose { background: #fff1f2; border-color: #fecdd3; } .tone-rose .label{color:#be123c}
  .tone-amber { background: #fffbeb; border-color: #fde68a; } .tone-amber .label{color:#b45309}

  .section { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 18px 20px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .section-head h3 { font-size: 14px; font-weight: 600; margin: 0; color: #1e293b; }

  /* form */
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .field span { font-size: 11px; font-weight: 600; color: #64748b; }
  .input, select.input { border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
  .input:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px #e0e7ff; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-ghost { background: #fff; border-color: #cbd5e1; color: #334155; }
  .btn-ghost:hover:not(:disabled) { background: #f8fafc; }

  /* chips / badges */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; }
  .chip-xl { background: #dbeafe; color: #1e40af; } .chip-xl .dot { background: #2563eb; }
  .chip-axis { background: #ffedd5; color: #9a3412; } .chip-axis .dot { background: #ea580c; }
  .chip-smartfren { background: #ffe4e6; color: #9f1239; } .chip-smartfren .dot { background: #e11d48; }
  .chip-default { background: #f1f5f9; color: #334155; } .chip-default .dot { background: #64748b; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .badge-masuk { background: #d1fae5; color: #065f46; }
  .badge-transfer { background: #dbeafe; color: #1e3a8a; }
  .badge-distribusi { background: #e0e7ff; color: #3730a3; }
  .badge-penjualan { background: #ffe4e6; color: #9f1239; }
  .badge-retur { background: #fef3c7; color: #92400e; }
  .badge-ganti { background: #ccfbf1; color: #115e59; }
  .badge-stok { background: #e2e8f0; color: #334155; }
  .badge-ok { background: #d1fae5; color: #065f46; }
  .badge-err { background: #ffe4e6; color: #9f1239; }

  /* table */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th { text-align: left; font-size: 11px; font-weight: 600; color: #64748b; padding: 8px 10px 8px 0; border-bottom: 1px solid #e2e8f0; }
  table.tbl td { padding: 7px 10px 7px 0; border-bottom: 1px solid #f1f5f9; }
  table.tbl tr:last-child td { border-bottom: none; }
  .tbl-scroll { max-height: 400px; overflow-y: auto; }
  .num { text-align: right; font-weight: 500; }
  .low { color: #e11d48; }
  .muted { color: #94a3b8; font-size: 12px; }
  code.inline { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 12px; }

  /* flow row */
  .flow-row { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .flow-node { flex-shrink: 0; border-radius: 10px; border: 1px solid #c7d2fe; background: #eef2ff; padding: 10px 16px; min-width: 140px; }
  .flow-node.rose { border-color: #fecdd3; background: #fff1f2; }
  .flow-node .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #4338ca; opacity: .8; }
  .flow-node.rose .lbl { color: #be123c; }
  .flow-arrow { flex-shrink: 0; color: #cbd5e1; }
  .flow-node .val { font-size: 17px; font-weight: 600; color: #312e81; }
  .flow-node.rose .val { color: #881337; }

  /* toast */
  #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 8px 20px rgba(0,0,0,.15); display: none; z-index: 50; }

  /* login */
  .login-wrap { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; }
  .login-card { width: 360px; background: #fff; border-radius: 14px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .login-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: #0f172a; margin-bottom: 6px; }
  .login-logo { width: 32px; height: 32px; border-radius: 7px; }
  .login-sub { font-size: 12.5px; color: #64748b; margin: 0 0 18px; }
  .login-error { background: #ffe4e6; color: #9f1239; font-size: 12.5px; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
  .login-hint { font-size: 11px; color: #94a3b8; margin-top: 16px; line-height: 1.6; }
  .user-badge { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; color: #64748b; line-height: 1.4; }
  .user-badge strong { color: #1e293b; font-size: 12.5px; }
  .toast-success { background: #059669; } .toast-error { background: #e11d48; } .toast-warning { background: #d97706; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .bar-label { width: 130px; flex-shrink: 0; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: #f1f5f9; border-radius: 5px; height: 14px; overflow: hidden; }
  .bar-fill { background: #4f46e5; height: 100%; border-radius: 5px; }
  .bar-val { width: 42px; text-align: right; font-weight: 600; color: #1e293b; }

  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475569; margin-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>
// ---------------- SUPABASE CONFIGURATION ----------------
// Silakan ganti URL dan API Key dengan milik akun Supabase Anda:
const SUPABASE_URL = "https://qwgfclqgjphdsytzldqp.supabase.co/rest/v1/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3Z2ZjbHFnanBoZHN5dHpsZHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1OTUxNTMsImV4cCI6MjEwMTE3MTE1M30.NP7A-hybPD_5J3uh8pXRfiEG7bx5OMqdOdb0wzIb2bE";

// Inisialisasi client Supabase
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// ---------------- utilities ----------------
const STORAGE_KEY = "gudang-sim-data-v6";

function uid(prefix) { return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8); }
function fmtDate(d) { return new Date(d).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }); }
function fmtDateShort(d) { return new Date(d).toLocaleDateString("id-ID", { day: "2-digit", month: "short" }); }
function fmtMonthShort(d) { return new Date(d).toLocaleDateString("id-ID", { month: "short", year: "2-digit" }); }

// ---------------- period / date filter ----------------
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d) { const x = new Date(d); x.setHours(23,59,59,999); return x; }
function getPeriodRange() {
  const now = new Date();
  const p = state.ui.period;
  if (p === "today") return { start: startOfDay(now), end: endOfDay(now) };
  if (p === "7d") { const s = new Date(now); s.setDate(s.getDate()-6); return { start: startOfDay(s), end: endOfDay(now) }; }
  if (p === "30d") { const s = new Date(now); s.setDate(s.getDate()-29); return { start: startOfDay(s), end: endOfDay(now) }; }
  if (p === "month") return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: endOfDay(now) };
  if (p === "year") return { start: new Date(now.getFullYear(), 0, 1), end: endOfDay(now) };
  if (p === "custom") {
    const start = state.ui.periodFrom ? startOfDay(new Date(state.ui.periodFrom)) : null;
    const end = state.ui.periodTo ? endOfDay(new Date(state.ui.periodTo)) : null;
    return { start, end };
  }
  return { start: null, end: null }; // "all"
}
function inPeriod(dateStr) {
  const { start, end } = getPeriodRange();
  if (!start && !end) return true;
  const d = new Date(dateStr);
  if (start && d < start) return false;
  if (end && d > end) return false;
  return true;
}
function periodLabel() {
  const labels = { all: "Semua waktu", today: "Hari ini", "7d": "7 hari terakhir", "30d": "30 hari terakhir", month: "Bulan ini", year: "Tahun ini", custom: "Periode kustom" };
  return labels[state.ui.period] || "Semua waktu";
}
function renderPeriodFilter() {
  const p = state.ui.period;
  return '<div class="section" style="padding:14px 20px"><div class="row" style="justify-content:space-between">' +
    '<div class="row">' +
      '<span class="muted" style="font-weight:600;color:#475569">Periode:</span>' +
      '<select class="input" onchange="onPeriodChange(this.value)">' +
        ["all","today","7d","30d","month","year","custom"].map(v => '<option value="'+v+'"'+(v===p?" selected":"")+'>'+({all:"Semua waktu",today:"Hari ini",'7d':"7 hari terakhir",'30d':"30 hari terakhir",month:"Bulan ini",year:"Tahun ini",custom:"Kustom (pilih tanggal)"}[v])+'</option>').join("") +
      '</select>' +
      (p === "custom" ? (
        '<input type="date" class="input" value="'+esc(state.ui.periodFrom)+'" onchange="onPeriodCustom(this.value, null)">' +
        '<span class="muted">s/d</span>' +
        '<input type="date" class="input" value="'+esc(state.ui.periodTo)+'" onchange="onPeriodCustom(null, this.value)">'
      ) : "") +
    '</div>' +
  '</div></div>';
}
function onPeriodChange(v) { state.ui.period = v; render(); }
function onPeriodCustom(from, to) {
  if (from !== null) state.ui.periodFrom = from;
  if (to !== null) state.ui.periodTo = to;
  render();
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function nfmt(n) { return Number(n || 0).toLocaleString("id-ID"); }

// ---------------- katalog barang (dari import Excel) ----------------
const CATALOG_SEED = [];

const STOCK_AWAL_SEED = {};

const BRAND_CHIP_CLASS = { xl: "chip-xl", axis: "chip-axis", smartfren: "chip-smartfren" };
function brandKey(brand) { return (brand || "").toString().trim().toLowerCase(); }
function brandLabel(brand) {
  const k = brandKey(brand);
  if (k === "xl") return "XL";
  if (k === "axis") return "Axis";
  if (k === "smartfren") return "Smartfren";
  return brand || "-";
}
function brandChipClass(brand) { return BRAND_CHIP_CLASS[brandKey(brand)] || "chip-default"; }
function categoryLabel(cat) {
  const k = (cat || "").toString().trim().toUpperCase();
  if (k === "SP") return "Kartu Perdana";
  if (k === "PV") return "Voucher";
  return cat || "-";
}
function uniqueBrands() { return Array.from(new Set(state.data.products.map(p => p.brand))); }

// ---------------- seed data ----------------
function buildProducts() {
  return CATALOG_SEED.map(p => ({
    id: p.id, name: p.name, brand: p.brand, category: p.category,
    familyPaket: p.familyPaket, materialCode: p.materialCode, cluster: p.cluster, price: p.price,
  }));
}

function buildSeed() {
  const products = buildProducts();

  const warehouses = [
    { id: "pusat", name: "Gudang Pusat", type: "pusat", kota: "-" },
  ];

  const salesTeam = [];

  const stock = {};
  warehouses.forEach((w) => {
    stock[w.id] = {};
    products.forEach((p) => {
      stock[w.id][p.id] = w.type === "pusat" ? (STOCK_AWAL_SEED[p.id] !== undefined ? STOCK_AWAL_SEED[p.id] : 0) : 0;
    });
  });

  const salesStock = {};

  const transactions = [];
  const returItems = [];

  const users = [
    { id: uid("user"), username: "admin.pusat", password: "admin123", name: "Admin Pusat", role: "admin_pusat", cabangId: "" },
    { id: uid("user"), username: "admin.cabang", password: "admin123", name: "Admin Cabang", role: "admin_cabang", cabangId: "" },
  ];

  return { products, warehouses, salesTeam, stock, salesStock, transactions, returItems, users };
}

// ---------------- state ----------------
const SESSION_KEY = "gudang-session-v1";
const state = {
  data: null,
  session: null,
  tab: "dashboard",
  ui: { cabangSelected: "", salesSelectedStok: "", uploadRows: [], uploadFileName: "", riwayatFilter: "", statusSourceType: "cabang",
    catalogRows: [], catalogFileName: "", catalogSearch: "", catalogBrandFilter: "", catalogCategoryFilter: "",
    stockImportRows: [], stockImportFileName: "",
    salesImportRows: [], salesImportFileName: "",
    period: "all", periodFrom: "", periodTo: "",
    loginError: "", userForm: false },
};

async function loadData() {
  if (supabase) {
    try {
      // Ambil data produk
      const { data: products } = await supabase.from('products').select('*');
      // Ambil data gudang
      const { data: warehouses } = await supabase.from('warehouses').select('*');
      // Ambil data sales
      const { data: salesTeam } = await supabase.from('sales_team').select('*');
      // Ambil data transaksi
      const { data: transactions } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });

      if (products && warehouses) {
        state.data = {
          products: products || [],
          warehouses: warehouses || [],
          salesTeam: salesTeam || [],
          transactions: (transactions || []).map(t => ({ ...t, date: t.created_at, productId: t.product_id })),
          stock: {},
          salesStock: {},
          returItems: [],
          users: [
            { id: uid("user"), username: "admin.pusat", password: "admin123", name: "Admin Pusat", role: "admin_pusat", cabangId: "" },
            { id: uid("user"), username: "admin.cabang", password: "admin123", name: "Admin Cabang", role: "admin_cabang", cabangId: "" }
          ]
        };
        
        // Load stok gudang
        const { data: wStock } = await supabase.from('warehouse_stock').select('*');
        warehouses.forEach(w => {
          state.data.stock[w.id] = {};
          products.forEach(p => state.data.stock[w.id][p.id] = 0);
        });
        (wStock || []).forEach(s => {
          if (state.data.stock[s.warehouse_id]) {
            state.data.stock[s.warehouse_id][s.product_id] = s.qty;
          }
        });

        render();
        return;
      }
    } catch (e) {
      console.error("Gagal memuat data dari Supabase:", e);
    }
  }

  // Fallback ke data seed jika database belum siap / offline
  const seed = buildSeed();
  state.data = seed;
  render();
}

async function restoreSession() {
  try {
    const userId = localStorage.getItem(SESSION_KEY);
    if (userId && state.data && state.data.users) {
      const user = state.data.users.find(u => u.id === userId);
      if (user) state.session = user;
    }
  } catch (e) {}
}

async function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) { console.error("gagal menyimpan", e); }
}

function clone(o) { return JSON.parse(JSON.stringify(o)); }

let toastTimer = null;
function notify(msg, kind) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast-" + (kind || "success");
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 3200);
}

async function pushTransaction(base) {
  const createdIso = new Date().toISOString();
  const newTrx = { 
    id: uid("trx"), 
    date: createdIso,
    created_at: createdIso, 
    type: base.type,
    from_loc: base.from || null,
    to_loc: base.to || null,
    product_id: base.productId,
    productId: base.productId,
    qty: base.qty,
    note: base.note || "" 
  };
  
  // Simpan ke state lokal
  state.data.transactions.unshift(newTrx);

  // Simpan ke Supabase jika terhubung
  if (supabase) {
    const { error } = await supabase.from('transactions').insert([{
      id: newTrx.id,
      created_at: newTrx.created_at,
      type: newTrx.type,
      from_loc: newTrx.from_loc,
      to_loc: newTrx.to_loc,
      product_id: newTrx.product_id,
      qty: newTrx.qty,
      note: newTrx.note
    }]);
    if (error) console.error("Gagal simpan transaksi ke Supabase:", error);
  }
}

// ---------------- mutations ----------------
function stockIn(warehouseId, productId, qty, note) {
  if (!warehouseId || !productId || !qty || qty <= 0) return notify("Lengkapi gudang, produk dan jumlah", "error");
  state.data.stock[warehouseId][productId] = (state.data.stock[warehouseId][productId] || 0) + qty;
  pushTransaction({ type: "masuk", to: warehouseId, productId, qty, note: note || "Barang masuk dari principal" });
  persist(); render();
  notify("Barang masuk berhasil dicatat");
}

function transferWarehouse(fromId, toId, productId, qty) {
  if (!fromId || !toId || fromId === toId || !productId || !qty || qty <= 0) return notify("Lengkapi asal, tujuan, produk dan jumlah", "error");
  const avail = state.data.stock[fromId]?.[productId] || 0;
  if (qty > avail) return notify("Stok " + fromId + " tidak cukup (tersedia " + avail + ")", "error");
  state.data.stock[fromId][productId] -= qty;
  state.data.stock[toId][productId] = (state.data.stock[toId][productId] || 0) + qty;
  pushTransaction({ type: "transfer", from: fromId, to: toId, productId, qty, note: "Perpindahan antar gudang" });
  persist(); render();
  notify("Perpindahan stok berhasil");
}

function distribusiToSales(warehouseId, salesId, productId, qty) {
  if (!warehouseId || !salesId || !productId || !qty || qty <= 0) return notify("Lengkapi gudang asal, sales, produk dan jumlah", "error");
  const avail = state.data.stock[warehouseId]?.[productId] || 0;
  if (qty > avail) return notify("Stok gudang tidak cukup (tersedia " + avail + ")", "error");
  state.data.stock[warehouseId][productId] -= qty;
  state.data.salesStock[salesId][productId] = (state.data.salesStock[salesId][productId] || 0) + qty;
  pushTransaction({ type: "distribusi", from: warehouseId, to: salesId, productId, qty, note: "Distribusi ke tim sales" });
  persist(); render();
  notify("Barang berhasil didistribusikan ke sales");
}

function addSalesPerson(id, name, gudangId, supervisor) {
  id = (id || "").trim();
  name = (name || "").trim();
  if (!id || !name) return notify("ID Sales dan Nama Sales wajib diisi", "error");
  if (state.data.salesTeam.find(s => s.id.toLowerCase() === id.toLowerCase())) return notify("ID Sales \"" + id + "\" sudah dipakai", "error");
  state.data.salesTeam.push({ id, name, gudang: gudangId || "", supervisor: (supervisor||"").trim() });
  state.data.salesStock[id] = {};
  state.data.products.forEach(p => state.data.salesStock[id][p.id] = 0);
  state.ui.salesSelectedStok = id;
  persist(); render();
  notify(name + " ditambahkan ke tim sales");
}

function deleteSalesPerson(id) {
  const sales = state.data.salesTeam.find(s => s.id === id);
  if (!sales) return;
  const totalStock = Object.values(state.data.salesStock[id] || {}).reduce((a,b)=>a+b,0);
  if (totalStock > 0) return notify("Stok " + sales.name + " harus dikosongkan dulu sebelum bisa dihapus (sisa " + nfmt(totalStock) + " unit)", "error");
  state.data.salesTeam = state.data.salesTeam.filter(s => s.id !== id);
  delete state.data.salesStock[id];
  if (state.ui.salesSelectedStok === id) state.ui.salesSelectedStok = "";
  persist(); render();
  notify(sales.name + " berhasil dihapus dari tim sales");
}

function addCabang(name, kota) {

function reportIssue(sourceType, sourceId, productId, qty, reason) {
  if (!sourceId || !productId || !qty || qty <= 0) return notify("Lengkapi lokasi, produk dan jumlah", "error");
  const bucket = sourceType === "sales" ? state.data.salesStock : state.data.stock;
  const avail = bucket[sourceId]?.[productId] || 0;
  if (qty > avail) return notify("Stok di lokasi tersebut tidak cukup (tersedia " + avail + ")", "error");
  bucket[sourceId][productId] -= qty;
  state.data.returItems.unshift({ id: uid("ret"), productId, qty, sourceType, sourceId, reason: reason || "-", status: "menunggu_penggantian", date: new Date().toISOString() });
  pushTransaction({ type: "retur_keluar", from: sourceId, productId, qty, note: reason || "Barang bermasalah, menunggu penggantian principal" });
  persist(); render();
  notify("Barang bermasalah dicatat, menunggu penggantian principal", "warning");
}

function resolveReplacement(returId) {
  const item = state.data.returItems.find(r => r.id === returId);
  if (!item) return;
  item.status = "selesai_diganti";
  item.resolvedDate = new Date().toISOString();
  state.data.stock.pusat[item.productId] = (state.data.stock.pusat[item.productId] || 0) + item.qty;
  pushTransaction({ type: "penggantian_masuk", to: "pusat", productId: item.productId, qty: item.qty, note: "Penggantian dari principal diterima" });
  persist(); render();
  notify("Penggantian diterima, stok gudang pusat diperbarui");
}

function applyCatalogImport() {
  const rows = state.ui.catalogRows.filter(r => r.status === "new" || r.status === "update");
  if (!rows.length) return;
  let added = 0, updated = 0;

  rows.forEach(r => {
    const existing = state.data.products.find(p => p.id === r.id);
    if (existing) {
      existing.name = r.name; existing.brand = r.brand; existing.category = r.category;
      existing.price = r.price; existing.cluster = r.cluster; existing.familyPaket = r.familyPaket;
      existing.materialCode = r.materialCode;
      updated++;
    } else {
      state.data.products.push({ id: r.id, name: r.name, brand: r.brand, category: r.category, price: r.price, cluster: r.cluster, familyPaket: r.familyPaket, materialCode: r.materialCode });
      state.data.warehouses.forEach(w => { if (!(r.id in state.data.stock[w.id])) state.data.stock[w.id][r.id] = 0; });
      state.data.salesTeam.forEach(s => { if (!(r.id in state.data.salesStock[s.id])) state.data.salesStock[s.id][r.id] = 0; });
      added++;
    }
  });

  const importedCluster = (rows.find(r => r.cluster) || {}).cluster;
  let renamed = false;
  if (importedCluster) {
    const pusat = state.data.warehouses.find(w => w.id === "pusat");
    const newName = "Gudang Pusat - " + importedCluster;
    if (pusat && pusat.name !== newName) { pusat.name = newName; pusat.kota = importedCluster; renamed = true; }
  }

  state.ui.catalogRows = [];
  state.ui.catalogFileName = "";
  persist(); render();
  notify(added + " produk baru ditambahkan, " + updated + " produk diperbarui" + (renamed ? ", nama Gudang Pusat diperbarui ke \"" + importedCluster + "\"" : ""));
}

// ---------------- Import / Export stok awal ----------------
function csvCell(v) {
  const s = (v===undefined||v===null) ? "" : v.toString();
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvCell).join(",")].concat(rows.map(r => r.map(csvCell).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadStockTemplate() {
  const headers = ["Sales Cluster", "Product ID", "Product Name", "Stok Awal", "Keterangan"];
  const rows = state.data.products.map(p => [p.cluster || "", p.id, p.name, "", ""]);
  downloadCSV("template_stok_awal.csv", headers, rows);
  notify("Template stok awal diunduh.");
}
function exportStockData() {
  const headers = ["Sales Cluster", "Product ID", "Product Name", "Stok Awal", "Keterangan"];
  const rows = [];
  state.data.warehouses.forEach(w => {
    state.data.products.forEach(p => {
      rows.push([p.cluster || "", p.id, p.name, state.data.stock[w.id]?.[p.id] || 0, w.name]);
    });

  downloadCSV("export_stok_gudang.csv", headers, rows);

}
function matchWarehouseByLabel(label) {
  const n = normalize(label);
  if (!n) return null;
  if (n.includes("pusat")) return state.data.warehouses.find(w => w.type === "pusat") || null;
  return state.data.warehouses.find(w => normalize(w.name) === n) ||
    state.data.warehouses.find(w => normalize(w.name).includes(n) || n.includes(normalize(w.name))) || null;
}
function buildStockImportRows(dataRows) {
  return dataRows.map((r, i) => {
    const productId = pickField(r, ["Product ID","id","sku","kode"]).toString().trim();
    const qtyRaw = pickField(r, ["Stok Awal","stok","qty","jumlah"]);
    const qty = parseInt((qtyRaw||"0").toString().replace(/[^0-9-]/g,""), 10) || 0;
    const keteranganRaw = pickField(r, ["Keterangan","gudang","warehouse","lokasi"]).toString().trim();
    const prod = state.data.products.find(p => p.id === productId);
    const wh = matchWarehouseByLabel(keteranganRaw);
    let status = "ok", issue = "";
    if (!prod) { status = "error"; issue = "Produk tidak ditemukan"; }
    else if (!wh) { status = "error"; issue = "Gudang \"" + (keteranganRaw||"-") + "\" tidak ditemukan"; }
    return { key: i, productId, productName: prod ? prod.name : productId, qty, keterangan: keteranganRaw, warehouseId: wh ? wh.id : null, warehouseName: wh ? wh.name : (keteranganRaw||"-"), status, issue };
  });
}
function handleStockImportFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  state.ui.stockImportFileName = file.name;
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "csv") {
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => {
      state.ui.stockImportRows = buildStockImportRows(results.data);
      render();
    }});
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      state.ui.stockImportRows = buildStockImportRows(rows);
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}
function applyStockImport() {

}

// ---------------- mini SVG charts ----------------
function areaChartSvg(points) {
  const w = 640, h = 220, padL = 34, padB = 22, padT = 10, padR = 10;
  const max = Math.max(1, ...points.map(p=>Math.max(p.masuk,p.keluar)));
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xy = (i,v) => [padL + i*stepX, padT + innerH - (v/max)*innerH];
  function pathFor(key) {
    return points.map((p,i)=>{ const [x,y]=xy(i,p[key]); return (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1); }).join(" ");
  }
  function areaFor(key) {
    const line = pathFor(key);
    const [xlast] = xy(points.length-1,0);
    const [xfirst] = xy(0,0);
    return line + " L" + xlast.toFixed(1) + "," + (padT+innerH) + " L" + xfirst.toFixed(1) + "," + (padT+innerH) + " Z";
  }
  let gridlines = "";
  for (let g=0; g<=4; g++) {
    const y = padT + innerH - (g/4)*innerH;
    gridlines += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#e2e8f0" stroke-width="1"/>';
    gridlines += '<text x="4" y="'+(y+3).toFixed(1)+'" font-size="10" fill="#94a3b8">'+Math.round(max*g/4)+'</text>';
  }
  let labels = "";
  points.forEach((p,i) => { if (i % 2 === 0) { const [x] = xy(i,0); labels += '<text x="'+x.toFixed(1)+'" y="'+(h-4)+'" font-size="10" fill="#94a3b8" text-anchor="middle">'+p.name+'</text>'; } });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-height:240px">' +
    gridlines +
    '<path d="'+areaFor("masuk")+'" fill="#a7f3d0" opacity="0.6"/>' +
    '<path d="'+pathFor("masuk")+'" fill="none" stroke="#059669" stroke-width="2"/>' +
    '<path d="'+areaFor("keluar")+'" fill="#fecdd3" opacity="0.55"/>' +
    '<path d="'+pathFor("keluar")+'" fill="none" stroke="#e11d48" stroke-width="2"/>' +
    labels +
  '</svg>';
}
function donutSvg(segments) {
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const cx=90, cy=90, r=62, sw=26;
  let angle = -90, paths = "";
  segments.forEach(s => {
    const frac = s.value/total;
    const start = angle;
    const end = angle + frac*360;
    angle = end;
    const large = (end-start) > 180 ? 1 : 0;
    const toRad = a => (a*Math.PI/180);
    const x1 = cx + r*Math.cos(toRad(start)), y1 = cy + r*Math.sin(toRad(start));
    const x2 = cx + r*Math.cos(toRad(end)), y2 = cy + r*Math.sin(toRad(end));
    paths += '<path d="M'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'"/>';
  });
  let legend = '<div>';
  segments.forEach(s => { legend += '<div class="legend-row"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+': <strong>&nbsp;'+nfmt(s.value)+'</strong></div>'; });
  legend += '</div>';
  return '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="180" height="180">'+paths+'</svg>'+legend+'</div>';
}
function barListHtml(items) {
  const max = Math.max(1, ...items.map(i=>i.qty));
  let html = "";
  items.forEach(i => {
    const pct = Math.round((i.qty/max)*100);
    html += '<div class="bar-row"><div class="bar-label" title="'+esc(i.name)+'">'+esc(i.name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-val">'+nfmt(i.qty)+'</div></div>';
  });
  return html || '<p class="muted">Belum ada data penjualan.</p>';
}

// ---------------- tab renderers ----------------
function renderDashboard() {
  const totalPusat = sumStockByType("pusat");
  const totalCabang = sumStockByType("cabang");
  const totalSales = sumSalesStock();
  const pendingReplacement = state.data.returItems.filter(r=>r.status==="menunggu_penggantian");
  const pendingQty = pendingReplacement.reduce((a,r)=>a+r.qty,0);

  const periodTx = state.data.transactions.filter(t => inPeriod(t.date));
  const masukPeriode = periodTx.filter(t=>t.type==="masuk").reduce((a,t)=>a+t.qty,0);
  const terjualPeriode = periodTx.filter(t=>t.type==="penjualan").reduce((a,t)=>a+t.qty,0);

  const { start, end } = getPeriodRange();
  const spanDays = (start && end) ? Math.ceil((end-start)/86400000) : null;
  const groupByMonth = spanDays !== null && spanDays > 31;
  const map = {};
  periodTx.forEach(t => {
    const key = groupByMonth ? fmtMonthShort(t.date) : fmtDateShort(t.date);
    if (!map[key]) map[key] = { name: key, masuk: 0, keluar: 0, _t: new Date(t.date).getTime() };
    if (t.type==="masuk" || t.type==="penggantian_masuk") map[key].masuk += t.qty;
    if (t.type==="penjualan") map[key].keluar += t.qty;
  });
  const flowData = Object.values(map).sort((a,b)=>a._t-b._t).slice(-60);

  const DONUT_COLORS = { xl: "#2563eb", axis: "#ea580c", smartfren: "#e11d48" };
  const FALLBACK_COLORS = ["#4f46e5", "#0d9488", "#a855f7", "#65a30d"];
  const opTotals = {};
  state.data.products.forEach(p => {
    let qty = 0;
    state.data.warehouses.forEach(w => qty += state.data.stock[w.id]?.[p.id] || 0);
    Object.values(state.data.salesStock).forEach(m => qty += m[p.id] || 0);
    opTotals[p.brand] = (opTotals[p.brand] || 0) + qty;
  });
  const donutSegments = Object.entries(opTotals).map(([brand, value], i) => ({
    name: brandLabel(brand), value, color: DONUT_COLORS[brandKey(brand)] || FALLBACK_COLORS[i % FALLBACK_COLORS.length],
  }));

  const sellTotals = {};
  periodTx.filter(t=>t.type==="penjualan").forEach(t => { sellTotals[t.productId] = (sellTotals[t.productId]||0) + t.qty; });
  const topSelling = Object.entries(sellTotals).map(([id,qty])=>({ name: state.data.products.find(p=>p.id===id)?.name || id, qty })).sort((a,b)=>b.qty-a.qty).slice(0,6);

  const pLabel = periodLabel();
  return '<div class="stack">' +
    renderPeriodFilter() +
    '<div class="grid grid-6">' +
      statCard("Stok Gudang Pusat", nfmt(totalPusat), "indigo") +
      statCard("Stok Gudang Cabang", nfmt(totalCabang), "blue") +
      statCard("Stok di Tim Sales", nfmt(totalSales), "slate") +
      statCard("Masuk (" + pLabel + ")", nfmt(masukPeriode), "emerald") +
      statCard("Terjual (" + pLabel + ")", nfmt(terjualPeriode), "rose") +
      statCard("Menunggu Penggantian", nfmt(pendingQty), "amber", pendingReplacement.length + " laporan") +
    '</div>' +
    '<div class="section"><div class="section-head"><h3>Alur perputaran barang</h3></div>' +
      '<div class="flow-row">' +
        '<div class="flow-node"><div class="lbl">Gudang Pusat</div><div class="val">'+nfmt(totalPusat)+'</div></div>' +
        '<span class="flow-arrow">&#8594;</span>' +
        '<div class="flow-node"><div class="lbl">Gudang Cabang</div><div class="val">'+nfmt(totalCabang)+'</div></div>' +
        '<span class="flow-arrow">&#8594;</span>' +
        '<div class="flow-node"><div class="lbl">Tim Sales</div><div class="val">'+nfmt(totalSales)+'</div></div>' +
        '<span class="flow-arrow">&#8594;</span>' +
        '<div class="flow-node rose"><div class="lbl">Terjual (' + pLabel + ')</div><div class="val">'+nfmt(terjualPeriode)+'</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="grid grid-2-1">' +
      '<div class="section"><div class="section-head"><h3>Barang masuk vs terjual (' + pLabel + ')</h3></div>' + areaChartSvg(flowData) + '<div class="legend-row"><span class="dot" style="background:#059669"></span>Masuk&nbsp;&nbsp;<span class="dot" style="background:#e11d48"></span>Terjual</div></div>' +
      '<div class="section"><div class="section-head"><h3>Stok per operator</h3></div>' + donutSvg(donutSegments) + '</div>' +
    '</div>' +
    '<div class="grid grid-2">' +
      '<div class="section"><div class="section-head"><h3>Produk terlaris (' + pLabel + ')</h3></div>' + barListHtml(topSelling) + '</div>' +
      '<div class="section"><div class="section-head"><h3>Transaksi (' + pLabel + ')</h3></div>' + transactionTable(periodTx.slice(0,6), true) + '</div>' +
    '</div>' +
  '</div>';
}

  const pusatWarehouse = state.data.warehouses.find(w=>w.id==="pusat");
  const importRows = state.ui.stockImportRows;
  const okCount = importRows.filter(r=>r.status==="ok").length;
  const errCount = importRows.filter(r=>r.status==="error").length;

  return '<div class="stack">' +
    '<div class="grid grid-3">' + statCard("Total unit di gudang pusat", nfmt(total), "indigo", pusatWarehouse ? pusatWarehouse.kota : "") + '</div>' +
    '<div class="section"><div class="section-head"><h3>Import &amp; export stok awal</h3>' +
      '<div class="row">' +
        '<button class="btn btn-ghost" onclick="downloadStockTemplate()">&#8681; Download template</button>' +
        '<button class="btn btn-ghost" onclick="exportStockData()">&#8681; Export data stok saat ini</button>' +
      '</div>' +
    '</div>' +
      '<p class="muted" style="font-size:13px;color:#64748b">Unggah file <code class="inline">.xlsx</code> atau <code class="inline">.csv</code> dengan kolom <code class="inline">Product ID</code>, <code class="inline">Stok Awal</code>, dan <code class="inline">Keterangan</code>.</p>' +
      '<div class="row"><input type="file" accept=".csv,.xlsx,.xls" onchange="handleStockImportFile(this)">' + (state.ui.stockImportFileName ? '<span class="muted">'+esc(state.ui.stockImportFileName)+'</span>' : '') + '</div>' +
      (importRows.length ? (
        '<div style="margin-top:14px"><div class="section-head"><h3 style="font-size:13px">Preview (' + okCount + '/' + importRows.length + ' baris siap' + (errCount ? ", " + errCount + " bermasalah" : "") + ')</h3>' +
          '<button class="btn btn-primary" ' + (okCount===0?"disabled":"") + ' onclick="applyStockImport()">&#10003; Terapkan ' + okCount + ' baris</button></div>' +
          '<div class="tbl-scroll" style="max-height:340px"><table class="tbl"><thead><tr><th>Produk</th><th>Gudang tujuan</th><th class="num">Stok baru</th><th>Status</th></tr></thead><tbody>' +
          importRows.map(r => '<tr><td>'+esc(r.productName)+'</td><td class="muted">'+esc(r.warehouseName)+'</td><td class="num">'+nfmt(r.qty)+'</td><td>' +
            (r.status==="ok" ? '<span class="badge badge-ok">&#10003; Siap</span>' : '<span class="badge badge-err">&#9888; '+esc(r.issue)+'</span>') +
            '</td></tr>').join("") +
          '</tbody></table></div></div>'
      ) : "") +
    '</div>' +
    '<div class="grid grid-2-1">' +
      '<div class="section"><div class="section-head"><h3>Stok per produk - Gudang Pusat</h3></div>' + productStockTable("pusat") + '</div>' +
      '<div class="section"><div class="section-head"><h3>Catat barang masuk</h3></div>' +
        '<div class="stack" style="gap:12px">' +
          '<label class="field"><span>Produk</span><select class="input" id="pusat-produk"><option value="">Pilih produk</option>' + productOptions("") + '</select></label>' +
          '<label class="field"><span>Jumlah</span><input class="input" type="number" min="1" id="pusat-qty" placeholder="Jumlah unit"></label>' +
          '<label class="field"><span>Catatan (opsional)</span><input class="input" id="pusat-note" placeholder="mis. restock dari principal"></label>' +
          '<button class="btn btn-primary" onclick="onStockIn()">+ Tambah stok masuk</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function onStockIn() {
  const productId = document.getElementById("pusat-produk").value;
  const qty = Number(document.getElementById("pusat-qty").value);
  const note = document.getElementById("pusat-note").value;
  stockIn("pusat", productId, qty, note);
}

function normKey(s) { return (s||"").toString().trim().toLowerCase().replace(/[^a-z0-9]/g, ""); }
function pickField(row, candidates) {
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const nc = normKey(cand);
    const found = keys.find(k => normKey(k) === nc);
    if (found !== undefined && row[found] !== undefined && row[found] !== "") return row[found];
  }
  return "";
}
function parsePrice(v) {
  if (typeof v === "number") return Math.round(v);
  const digits = (v||"").toString().replace(/[^0-9]/g, "");
  return digits ? parseInt(digits, 10) : 0;
}
function normalize(s) { return (s||"").toString().trim().toLowerCase(); }

function renderLogin() {
  return '<div class="login-wrap">' +
    '<div class="login-card">' +
      '<div class="login-brand"><span>Inventory System</span></div>' +
      '<p class="login-sub">Silakan masuk ke akun Anda</p>' +
      (state.ui.loginError ? '<div class="login-error">'+esc(state.ui.loginError)+'</div>' : '') +
      '<div class="stack" style="gap:12px">' +
        '<label class="field"><span>Username</span><input class="input" id="login-username" value="admin.pusat"></label>' +
        '<label class="field"><span>Password</span><input class="input" type="password" id="login-password" value="admin123"></label>' +
        '<button class="btn btn-primary" onclick="doLogin()">Masuk</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderMain() {
  const activeTab = state.tab;
  const tabs = [
    { id: "dashboard", label: "Dashboard" },
    { id: "pusat", label: "Gudang Pusat" },
  ];
  return '<div class="sidebar">' +
    '<div class="sidebar-brand"><div class="sidebar-brand-title">Inventory Studio</div></div>' +
    '<div class="nav">' +
      tabs.map(t => '<button class="nav-item '+(t.id===activeTab?"active":"")+'" onclick="setTab(\''+t.id+'\')">'+esc(t.label)+'</button>').join("") +
    '</div>' +
    '<div class="sidebar-foot"><button class="btn btn-ghost" onclick="doLogout()">Logout</button></div>' +
  '</div>' +
  '<div class="main">' +
    '<div class="topbar"><div class="topbar-date">'+fmtDate(new Date())+'</div></div>' +
    '<div class="content">' +
      (activeTab === "dashboard" ? renderDashboard() : renderGudangPusat()) +
    '</div>' +
  '</div>';
}

function setTab(tab) { state.tab = tab; render(); }

function render() {
  const root = document.getElementById("root");
  if (!state.session) {
    root.innerHTML = renderLogin();
  } else {
    root.innerHTML = renderMain();
  }
}

// Inisialisasi awal
(async function init() {
  await loadData();
  await restoreSession();
  render();
})();
</script>
